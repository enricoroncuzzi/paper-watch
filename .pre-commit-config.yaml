# Checks that run on every `git commit` once installed with: uv run pre-commit install
repos:
  # Lint (auto-fixing what it can) and format Python.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks: [{id: ruff-check, args: [--fix]}, {id: ruff-format}]
  # Blocks commits that contain secrets such as API keys.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks: [{id: gitleaks}]
  # Small hygiene fixes and YAML syntax checks.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks: [{id: end-of-file-fixer}, {id: trailing-whitespace}, {id: check-yaml}]
  # Lints GitHub Actions workflows: syntax, expressions, and shellcheck over
  # `run:` blocks when shellcheck is on PATH (it is on CI's ubuntu-latest).
  # The golang hook builds actionlint itself, so no local install is needed.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks: [{id: actionlint}]
  # Audits workflows, dependabot.yml, and this file for security issues.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1
    hooks: [{id: zizmor}]
