# Topic profiles drive which arXiv papers are fetched and how each item is routed.
# categories are arXiv category filters; terms are broad OR-ed query terms and the keyword
# classifier's vocabulary. weight is the profile's editorial priority (1.0 is the primary topic):
# no M1 code reads it, and relevance routing ignores it on purpose, because each item goes to the
# profile with the highest calibrated relevance (measured 2026-10-13: routing by weight instead
# scored lower, and only 4 of 328 labelled abstracts matched two profiles).
#
# description is the text the embedding classifier embeds as the profile's vector, and
# relevance_threshold is the cosine similarity (with LOCAL_EMBEDDING_MODEL in
# src/paperwatch/config.py) at or above which an item matches the profile. The two are calibrated
# together for that one model on the hand-labelled abstracts in evals/data/relevance/:
# `uv run python -m evals.relevance_eval --write` chooses each threshold on the validation half
# and rewrites the threshold lines below, and evals/relevance_baseline.json records the date, the
# model, a fingerprint of the descriptions and the data, and the held-out scores. After changing a
# description or the model, rerun it: the unit tests fail until the two agree again.
# The committed baseline was computed on arm64 (Apple M2); Linux x86-64 numerics are confirmed by
# one manual `model-evals` run before the gate is relied on. The 0.03 tolerance absorbs a flipped
# abstract or two.
profiles:
  - name: agentic-engineering
    weight: 1.0
    categories: [cs.AI, cs.CL, cs.MA, cs.SE, cs.LG]
    terms: ["agent", "agentic", "tool use", "tool-use", "multi-agent", "harness", "coding agent", "LLM agent", "agent evaluation", "planning", "memory", "bot"]
    description: >-
      Building, evaluating or analysing LLM agents: agent harnesses, tool use, multi-agent
      systems, coding agents, agent memory and planning, agent benchmarks and evaluation, and bots.
    relevance_threshold: 0.813
  - name: ai-forensics
    weight: 0.7
    categories: [cs.CV, cs.CR, cs.MM]
    terms: ["synthetic image", "deepfake", "image forensics", "generated image detection", "provenance", "watermark"]
    description: >-
      Detecting, attributing, watermarking or tracing the provenance of synthetic or manipulated
      media: deepfake detection, AI-generated image, audio, video and text detection, and
      watermarking of generated content.
    relevance_threshold: 0.799
  - name: ml-architectures
    weight: 0.4
    categories: [cs.LG, stat.ML]
    terms: ["architecture", "state space model", "mixture of experts", "transformer alternative", "attention"]
    description: >-
      A new neural network architecture or building block for deep learning models: attention
      mechanisms, linear attention and recurrent memory, state space models, mixture-of-experts
      layers and routing, positional encodings, and looped or hybrid transformer designs.
    relevance_threshold: 0.816
