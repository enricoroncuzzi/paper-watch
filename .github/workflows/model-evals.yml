# Real-model checks: the opt-in `model` tests, including the relevance gate, run with the local
# embedding model. Kept out of ci.yml so the default checks stay offline and model-free; this
# workflow runs only when a change can move a relevance score, every Monday (to notice an
# upstream model or runtime change), and by hand.
name: model-evals
on:
  pull_request:
    paths:
      - config/profiles.yaml
      - evals/relevance_eval.py
      - evals/relevance_baseline.json
      - evals/data/relevance/**
      - src/paperwatch/config.py
      - src/paperwatch/domain.py
      - src/paperwatch/llm/**
      - tests/model/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/model-evals.yml
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: model-evals-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      # The model download (about 200 MB) happens once per cache entry, not once per run.
      # Bump the key's suffix to force a fresh download.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fastembed
          key: fastembed-granite-embedding-small-english-r2-${{ runner.os }}-v1
      - run: uv run pytest -m model --no-cov
        env:
          PW_LOCAL_EMBEDDING_CACHE_DIR: ${{ runner.temp }}/fastembed
