# CodeQL static analysis for dangerous code patterns (GitHub's default setup):
# on every pull request, on pushes to main, and weekly so newly published
# queries reach the repository even without a code change.
name: codeql
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * 0"
# Actions are pinned to full commit SHAs; see the note at the top of ci.yml.
# Least privilege: the workflow itself only reads the repository.
permissions:
  contents: read
# Same rule as ci.yml: cancel superseded pull request runs, and key other runs
# by commit so every main commit keeps its own run.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # Fail fast instead of the 360-minute default if analysis hangs.
    timeout-minutes: 30
    # CodeQL needs to publish its findings to code scanning and read query packs;
    # every other scope stays read-only.
    permissions:
      security-events: write # upload results to code scanning
      packages: read # download CodeQL query packs
      actions: read # read workflow run metadata for the analysis
      contents: read # check out the code
    strategy:
      fail-fast: false
      matrix:
        include:
          # Neither language needs a build step, so both use build-mode none.
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      # No step pushes, so do not leave the token in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
