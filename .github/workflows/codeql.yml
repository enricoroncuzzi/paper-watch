# CodeQL static analysis for dangerous code patterns (GitHub's default setup):
# on every pull request, on pushes to main, and weekly so newly published
# queries reach the repository even without a code change.
name: codeql
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "30 1 * * 0"
# Least privilege: the workflow itself only reads the repository.
permissions:
  contents: read
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # CodeQL needs to publish its findings to code scanning and read query packs;
    # every other scope stays read-only.
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Neither language needs a build step, so both use build-mode none.
          - language: actions
            build-mode: none
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
