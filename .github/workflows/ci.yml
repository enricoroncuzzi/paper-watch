# Continuous integration: the same checks run in parallel on every change, and
# the cheapest ones report first because they finish sooner.
#
# Every action is pinned to a full commit SHA (a tag can be moved to point at
# different code, a SHA cannot); the trailing comment names the release, and
# Dependabot's github-actions updates bump both together.
name: ci
on:
  pull_request:
  push:
    branches: [main]
# Everything here only reads the repository, so grant no write scope.
permissions:
  contents: read
# On a pull request a newer push supersedes the running check, so cancel it.
# On main the group is keyed by commit, so no run is queued behind or cancelled
# by another and every merge gets its own verdict, however quickly they land.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    runs-on: ubuntu-latest
    # Fail fast instead of the 360-minute default if a step hangs.
    timeout-minutes: 10
    steps:
      # No job pushes, so do not leave the token in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      # --locked fails if uv.lock is out of date with pyproject.toml
      # (--frozen would silently install the stale lock).
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run mypy
  test:
    runs-on: ubuntu-latest
    # Longer than the others: the integration tests pull a Postgres image.
    timeout-minutes: 20
    # ubuntu-latest ships Docker, which the integration tests need to start a
    # Postgres + pgvector container.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run pytest
  eval:
    # Runs the retrieval eval against a real pgvector Postgres on every change, so a quality
    # drop fails CI, not just a behaviour change.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    services:
      db:
        # Pinned like tests/conftest.py and docker-compose.yml: the search settings need pgvector 0.8+.
        image: pgvector/pgvector:0.8.7-pg16
        env: {POSTGRES_USER: paperwatch, POSTGRES_PASSWORD: paperwatch, POSTGRES_DB: paperwatch}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U paperwatch" --health-interval 5s --health-retries 10
    steps:
      # Same pins and hardening as the jobs already in ci.yml, or the zizmor workflow gate fails.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      # The eval creates and migrates its own throwaway database, so the service DB is only the
      # server it connects to; no `alembic upgrade head` against it is needed.
      - run: uv run paperwatch eval
      # The QA eval replays a committed recording through the current checker: no model, no
      # network and no database, so a checker or scoring regression fails here too.
      - run: uv run paperwatch qa-eval
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history so gitleaks can scan past commits, not just the checkout tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      # Known-vulnerable dependencies. The project itself is unpublished and so
      # cannot be audited; export the locked third-party set and audit that.
      - run: uv export --locked --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/requirements.txt"
      # Pillow 12.3.0 has advisories fixed only in 13.0.0, but fastembed 0.9.0 pins pillow<13
      # and nothing newer is released. Pillow is only fastembed's image-embedding path; this project
      # embeds text and never opens an image. Drop the ignores once fastembed allows pillow 13.
      - run: |
          uv run --with pip-audit pip-audit --strict --timeout 60 --no-deps -r "$RUNNER_TEMP/requirements.txt" \
            --ignore-vuln CVE-2026-112895 \
            --ignore-vuln CVE-2026-112400 \
            --ignore-vuln CVE-2026-112397 \
            --ignore-vuln CVE-2026-112896 \
            --ignore-vuln CVE-2026-112897 \
            --ignore-vuln CVE-2026-112395 \
            --ignore-vuln CVE-2026-112404 \
            --ignore-vuln CVE-2026-112899 \
            --ignore-vuln CVE-2026-112402 \
            --ignore-vuln CVE-2026-112900 \
            --ignore-vuln CVE-2026-112893 \
            --ignore-vuln CVE-2026-112392 \
            --ignore-vuln CVE-2026-112891 \
            --ignore-vuln CVE-2026-112405 \
            --ignore-vuln CVE-2026-112390 \
            --ignore-vuln CVE-2026-112401 \
            --ignore-vuln CVE-2026-112901 \
            --ignore-vuln CVE-2026-112391 \
            --ignore-vuln CVE-2026-112894 \
            --ignore-vuln CVE-2026-112406 \
            --ignore-vuln CVE-2026-112399 \
            --ignore-vuln CVE-2026-112892 \
            --ignore-vuln CVE-2026-112393 \
            --ignore-vuln CVE-2026-112396 \
            --ignore-vuln CVE-2026-96636 \
            --ignore-vuln CVE-2026-96637 \
            --ignore-vuln CVE-2026-96638 \
            --ignore-vuln CVE-2026-96639 \
            --ignore-vuln CVE-2026-96640 \
            --ignore-vuln CVE-2026-96641 \
            --ignore-vuln CVE-2026-96642 \
            --ignore-vuln CVE-2026-96643 \
            --ignore-vuln CVE-2026-96644 \
            --ignore-vuln CVE-2026-96778 \
            --ignore-vuln GHSA-78g4-xqwv-q3g8
      # Committed secrets. The token lets the action read the pull request's
      # commits; comments are off because this workflow cannot write to PRs.
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      # Run the same hooks, at the same pinned revs, as a local `git commit`.
      # actionlint checks workflow syntax and expressions, and runs shellcheck
      # (preinstalled on ubuntu-latest) over every `run:` block.
      - run: uv run pre-commit run actionlint --all-files --show-diff-on-failure
      # zizmor audits workflow security: permissions, template injection,
      # unpinned actions, persisted credentials. It runs offline (no token).
      - run: uv run pre-commit run zizmor --all-files --show-diff-on-failure
