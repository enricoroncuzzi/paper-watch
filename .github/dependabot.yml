# Keep dependencies current with small, scheduled pull requests.
version: 2
updates:
  # Python dependencies, including the uv lockfile (uv is a supported ecosystem).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Wait a week after a release before proposing it: most compromised or
    # broken releases are yanked within days.
    cooldown:
      default-days: 7
    # One pull request for all minor and patch bumps; majors stay separate because they are the
    # ones likely to need code changes. publicsuffixlist is carved out into a group of its own: it
    # ships a new public-suffix snapshot almost daily, and as its own group on a weekly schedule it
    # opens at most one pull request a week, with the cooldown above keeping a fresh release out.
    # It is excluded from the wide group rather than left to group order.
    groups:
      publicsuffixlist:
        patterns: ["publicsuffixlist"]
      minor-and-patch:
        update-types: ["minor", "patch"]
        exclude-patterns: ["publicsuffixlist"]
  # Keep the page's npm dependencies current; same week-long cooldown, because a compromised
  # release is usually yanked within days.
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  # Keep the SHA-pinned actions in .github/workflows current; each update
  # rewrites the SHA and its version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  # Keep the hook revs in .pre-commit-config.yaml current; the workflow-lint
  # CI job runs actionlint and zizmor from these same revs.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
