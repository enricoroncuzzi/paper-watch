[project]
name = "paperwatch"
version = "0.6.5"
description = "A growing, queryable corpus of AI research, answered with hybrid retrieval and citation-checked agents"
readme = "README.md"
authors = [
    { name = "enricoroncuzzi", email = "enrico.roncuzzi98@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "anyio>=4.4",
    "fastapi>=0.143",
    "fastembed>=0.9",
    "feedparser>=6.0.11",
    "httpx>=0.28",
    "langchain-core>=1.6",
    "langchain-openai>=1.7",
    "langgraph>=1.2",
    "openai>=1.60",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "publicsuffixlist>=1.1.2.20261023",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.2",
    "sqlalchemy>=2.0.36",
    "structlog>=24.4",
    "tenacity>=9.0",
    "typer>=0.15",
    "uvicorn>=0.54",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
    "testcontainers[postgres]>=4.9",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "evals"]

[[tool.mypy.overrides]]
module = ["feedparser", "feedparser.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `evals/` sits at the repository root, outside the installed `src` package, so pytest must add
# the root to sys.path for `from evals.retrieval_eval import ...` to import.
pythonpath = ["."]
# Real-model tests are opt-in (`uv run pytest -m model`): default CI stays offline and light.
addopts = "-ra --strict-markers --cov=paperwatch --cov-report=term-missing -m 'not model'"
markers = [
    "integration: needs a Postgres container",
    "model: loads the real local embedding model (downloads about 180 MB once)",
]

[project.scripts]
paperwatch = "paperwatch.cli:app"
